name: download-agents

# Mirrors every character file listed in agents.yaml to two places, then writes
# the sha256s into agents.json for the flake to pin.
#
#   releases   one per agent, tagged with its id, holding the character file
#              and its thumbnail. Two assets per release stays clear of
#              GitHub's cap of 1000 assets per release, which a release per
#              source directory cannot -- `char` alone holds over 13,000.
#   ghcr.io    one package per directory, one tag per agent, with the exact
#              original filename in the layer annotation. Browsable and
#              correctly named, but token-gated, so it is the front door
#              rather than the fetcher.
#
# Nothing is committed to the repo but manifests -- the ~52 GB of characters
# lives in releases and packages, so cloning this repo (or using it as a flake
# input) stays cheap and `nix build .#<agent>` fetches exactly one file.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel shards to split the corpus across"
        default: "40"
      dry_run:
        description: "Download and validate, but upload nothing"
        type: boolean
        default: false
      commit_links:
        description: "Commit the re-harvested agents.yaml"
        type: boolean
        default: true
  schedule:
    # Monthly: the upstream site adds characters steadily but not quickly.
    - cron: "23 4 1 * *"

permissions:
  contents: write
  # ghcr.io pushes; the default token can publish packages only if asked.
  packages: write

concurrency:
  # Two of these running at once would fight over the same release assets.
  group: download-agents
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: harvest agents.yaml
        # Always run: a shard handed a manifest from before a schema change
        # fails on the missing field. Cheap enough not to gate.
        run: ./bin/download-agent-links -o agents.yaml

      - name: commit refreshed links
        if: ${{ github.event_name == 'schedule' || inputs.commit_links }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents.yaml
          git diff --cached --quiet && echo "no link changes" && exit 0
          git commit -m "agents.yaml: refresh links from tmafe.com"
          git push

      - name: build shard matrix
        id: matrix
        env:
          SHARDS: ${{ inputs.shards || '40' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = int(os.environ.get("SHARDS") or 40)
          # Releases are per source directory, not per shard, so a shard
          # only needs to know which slice of the manifest it owns.
          print("matrix=" + json.dumps([{"shard": i, "shards": n}
                                        for i in range(n)]))
          PY

      - name: report plan
        run: |
          python3 - <<'PY'
          import yaml
          d = yaml.safe_load(open("agents.yaml"))
          s = d["stats"]
          print(f"{s['count']} agents, {s['total_human']} listed upstream")
          PY

      # The shards check out the triggering commit, not the one plan just
      # pushed, so hand them the manifest directly.
      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: agents.yaml
          retention-days: 3

  mirror:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The upstream host is a hobby server; this is as much politeness as it
      # is staying inside the runner concurrency we actually have.
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Each shard streams one file at a time, but a slow upstream plus ~860 MB
    # of uploads still wants room.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - uses: actions/download-artifact@v4
        with:
          name: manifest

      - name: install oras
        uses: oras-project/setup-oras@v1

      - name: log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: mirror shard ${{ matrix.shard }}
        env:
          # A release per agent is ~3 REST calls each. GITHUB_TOKEN is capped
          # at 1000 requests/hour/repository, which would take days; a PAT
          # gets 5000/hour. Falls back so the workflow still runs without one.
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./bin/mirror-agents \
            --shard  "${{ matrix.shard }}" \
            --shards "${{ matrix.shards }}" \
            --out    "partial-${{ matrix.shard }}.json" \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: partial-${{ matrix.shard }}
          path: partial-${{ matrix.shard }}.json
          retention-days: 7

  manifest:
    needs: mirror
    # Fold in whatever shards did succeed; a single flaky shard shouldn't cost
    # us the whole run's hashes.
    if: ${{ always() && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: partials
          pattern: partial-*
          merge-multiple: true

      - name: merge into agents.json
        run: ./bin/merge-manifests partials -o agents.json --keep-existing

      - name: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add agents.json
          git diff --cached --quiet && echo "no manifest changes" && exit 0
          git commit -m "agents.json: mirror $(python3 -c 'import json;print(len(json.load(open("agents.json"))))') agents"
          git push
