name: screenshot-agents

# Renders a thumbnail for every character and publishes them as a gh-pages
# gallery at images/<dir>/<name>.png, mirroring the character file tree.
#
# Deliberately not committed to the default branch: a `github:` flake input
# fetches a tarball of the whole repo, so ~185 MB of thumbnails there would be
# downloaded by everyone using the flake. Pages is a separate deployment, so
# the flake input stays a couple of megabytes.
#
# Thumbnails are decoded by lib/acs.py, which implements the MSAgent Character
# Data Specification -- nothing off-the-shelf renders .acs on Linux.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel render shards"
        default: "20"
      box:
        description: "Thumbnail longest side, px"
        default: "96"
      only:
        description: "Restrict to one source directory (blank = all)"
        default: ""
  workflow_run:
    # Re-render after a mirror run lands new characters.
    workflows: [download-agents]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: screenshot-agents
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: m
        env:
          SHARDS: ${{ inputs.shards || '20' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = int(os.environ.get("SHARDS") or 20)
          print("matrix=" + json.dumps([{"shard": i, "shards": n} for i in range(n)]))
          PY

  render:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: render shard ${{ matrix.shard }}
        run: |
          ./bin/render-agents \
            --shard  "${{ matrix.shard }}" \
            --shards "${{ matrix.shards }}" \
            --box    "${{ inputs.box || '96' }}" \
            --out    images \
            --report "render-${{ matrix.shard }}.json" \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.shard }}
          path: |
            images/
            render-${{ matrix.shard }}.json
          retention-days: 3

  publish:
    needs: render
    # Publish whatever rendered; one flaky shard shouldn't cost the gallery.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: images-*
          merge-multiple: true

      - name: assemble site
        run: |
          mkdir -p site
          # merge-multiple lands every shard's images/ into one tree
          mv shards/images site/images
          ./bin/generate-site --images site/images --out site | tee site-stats.json
          echo "thumbnails: $(find site/images -name '*.png' | wc -l)"
          du -sh site

      - name: render report
        run: |
          python3 - <<'PY'
          import glob, json, collections
          stats, reasons = collections.Counter(), collections.Counter()
          for f in glob.glob('shards/render-*.json'):
              r = json.load(open(f))
              stats.update(r.get('stats') or {})
              for v in (r.get('failures') or {}).values():
                  reasons[v.split(':')[0][:60]] += 1
          print("totals:", dict(stats))
          for k, v in reasons.most_common(10):
              print(f"  {v:6}  {k}")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
