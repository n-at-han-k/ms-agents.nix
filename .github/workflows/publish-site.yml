name: publish-site

# Publishes the gh-pages gallery from agents.json.
#
# No rendering and no images here: each agent's own release carries its
# thumbnail, so the site points straight at those asset URLs. That keeps the
# deployment a few MB of HTML rather than ~185 MB of duplicated PNGs, and keeps
# images off the default branch -- a `github:` flake input fetches a tarball of
# the whole repo, so anything committed there is downloaded by every consumer.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["agents.json", "bin/generate-site"]
  workflow_run:
    workflows: [download-agents]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  # reading partial manifests off the mirror run's artifacts
  actions: read

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # agents.json is only committed once every shard has finished, so on its
      # own the gallery would stay empty through a multi-hour mirror run. Each
      # shard uploads its partial as it completes, so fold those in and the
      # site reflects whatever has been mirrored so far.
      - name: fold in in-flight shard results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh run list --workflow=download-agents --limit 1 \
            --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$run_id" ]; then
            echo "folding in partials from run $run_id"
            gh run download "$run_id" --pattern 'partial-*' --dir partials 2>/dev/null || true
          fi
          if [ -d partials ] && [ -n "$(find partials -name '*.json' -print -quit)" ]; then
            ./bin/merge-manifests partials -o agents.json --keep-existing
          else
            echo "no partials available; using committed agents.json"
          fi

      - name: generate site
        run: |
          if [ "$(python3 -c 'import json;print(len(json.load(open("agents.json"))))')" = "0" ]; then
            echo "no agents mirrored yet -- nothing to publish" >&2
            exit 1
          fi
          ./bin/generate-site --manifest agents.json --out site
          du -sh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
