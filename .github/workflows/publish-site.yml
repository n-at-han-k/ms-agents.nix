name: publish-site

# Publishes the gh-pages gallery from agents.json.
#
# No rendering and no images here: each agent's own release carries its
# thumbnail, so the site points straight at those asset URLs. That keeps the
# deployment a few MB of HTML rather than ~185 MB of duplicated PNGs, and keeps
# images off the default branch -- a `github:` flake input fetches a tarball of
# the whole repo, so anything committed there is downloaded by every consumer.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["agents.json", "bin/generate-site"]
  workflow_run:
    workflows: [download-agents]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: generate site
        run: |
          if [ ! -s agents.json ]; then
            echo "agents.json is empty -- run download-agents first" >&2
            exit 1
          fi
          ./bin/generate-site --manifest agents.json --out site
          du -sh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
